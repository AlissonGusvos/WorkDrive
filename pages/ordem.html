<main>
    <div class="title-container">
        <h1 class="title">Ordens de Serviço</h1>
    </div><!--TITLE CONTAINER-->

    <div class="add-ordem">
        <button type="button" id="abrir-modal-ordem">Nova Ordem</button>
    </div>

    <section class="background-black" id="fundo-modal-ordem" aria-hidden="true">
        <div id="modal">
            <div class="modal-head">
                <h3>Nova Ordem</h3>
            </div><!--HEAD MODAL-->

            <form id="formulario">
                <input id="servico-ordem" type="text" placeholder="Nome do serviço:" required>
                <input id="preco-ordem" type="number" placeholder="Preço:" min="0.01" step="0.01" required>

                <select id="placa-ordem" required>
                    <option value="">Selecione a placa do veículo</option>
                </select>

                <input id="cliente-selecionado" type="text" placeholder="Dados do cliente" readonly>

                <select id="fase-ordem" required>
                    <option value="aguardando">Aguardando Peça</option>
                    <option value="execucao">Em Execução</option>
                    <option value="concluido">Concluído</option>
                </select>

                <div class="form-opt">
                    <button type="button" class="form-save" id="form-save-ordem">Salvar</button>
                    <button type="button" class="form-cancel" id="form-cancel-ordem">Cancelar</button>
                </div><!--FORM OPTIONS-->
            </form>
        </div><!--MODAL-->
    </section>

    <div class="kanban">
        <div class="coluna" data-status="aguardando">
            <span class="ordem-name-stat">Aguardando Peça</span>
            <div class="card-area"></div>
        </div><!--COLUNA-->

        <div class="coluna" data-status="execucao">
            <span class="ordem-name-stat">Em Execução</span>
            <div class="card-area"></div>
        </div><!--COLUNA-->

        <div class="coluna" data-status="concluido">
            <span class="ordem-name-stat">Concluído</span>
            <div class="card-area"></div>
        </div><!--COLUNA-->
    </div><!--KANBAN-->
</main>
