<main>
    <div class="title-container">
        <h1 class="title">Estoque</h1>
    </div><!--TITLE CONTAINER-->

    <div class="add-peca"><button type="button" id="abrir-modal">Adicionar item</button></div>

    <section class="background-black" id="fundo-modal" aria-hidden="true">
        <div id="modal">
            <div class="modal-head">
                <h3 id="titulo-modal">Adicionar item</h3>
            </div><!--HAED MODAL-->

            <form id="formulario">
                <input id="nome-item" type="text" placeholder="Nome do item:" required>
                <input id="quantidade-item" type="number" placeholder="Quantidade" min="0" step="1" required>
                <input id="minimo-item" type="number" placeholder="Quantidade mínima:" min="0" step="1" required>
                <input id="preco-item" type="number" placeholder="Preço:" min="0.01" step="0.01" required>

                <div class="form-opt">
                    <button type="button" id="form-save">Salvar</button>
                    <button type="button" id="form-cancel">Cancelar</button>
                </div><!--OPÇOES DO FORM-->
            </form>
        </div><!--MODAL-->
    </section>

    <div class="panel">
        <div class="panel-head">
            <div class="painel-estoque-head">
                <div class="rw-peca">Peça</div>
                <div class="rw-quant">Quantidade</div>
                <div class="rw-min">Minimo</div>
                <div class="rw-preco">Preço Unitário</div>
                <div class="rw-status">Status</div>
                <div class="rw-apagar"> </div>
            </div>
        </div><!--HEAD PAINEL-->

        <div class="panel-body" id="lista-estoque"></div><!--PANEL BODY-->
    </div><!--PAINEL-->

</main>
